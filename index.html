<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="algebra">Algebra</button>
            <button class="tab-btn" data-tab="trigonometry">Trigonometry</button>
            <button class="tab-btn" data-tab="calculus">Calculus</button>
            <button class="tab-btn" data-tab="units">Units</button>
        </div>

        <!-- Display -->
        <div class="display">
            <input type="text" id="display" readonly value="0">
        </div>

        <!-- Algebra Section -->
        <div id="algebra" class="tab-content active">
            <div class="buttons">
                <!-- Row 1 -->
                <button class="btn function" onclick="insertFunction('sqrt(')">√</button>
                <button class="btn function" onclick="insertFunction('cbrt(')">∛</button>
                <button class="btn operator" onclick="appendToDisplay('(')" data-key="(">(</button>
                <button class="btn operator" onclick="appendToDisplay(')')" data-key=")">)</button>
                <button class="btn clear" onclick="clearDisplay()">×</button>
                <button class="btn clear" onclick="clearDisplay()">AC</button>
                
                <!-- Row 2 -->
                <button class="btn function" onclick="insertFunction('pow(')">x²</button>
                <button class="btn function" onclick="insertFunction('pow(')">xʸ</button>
                <button class="btn operator" onclick="appendToDisplay('<')">＜</button>
                <button class="btn number" onclick="appendToDisplay('7')" data-key="7">7</button>
                <button class="btn number" onclick="appendToDisplay('8')" data-key="8">8</button>
                <button class="btn number" onclick="appendToDisplay('9')" data-key="9">9</button>
                <button class="btn operator" onclick="appendToDisplay('+')" data-key="+">+</button>
                
                <!-- Row 3 -->
                <button class="btn function" onclick="insertFunction('log(')">log</button>
                <button class="btn function" onclick="insertFunction('factorial(')">n!</button>
                <button class="btn operator" onclick="appendToDisplay('>')">&gt;</button>
                <button class="btn number" onclick="appendToDisplay('4')" data-key="4">4</button>
                <button class="btn number" onclick="appendToDisplay('5')" data-key="5">5</button>
                <button class="btn number" onclick="appendToDisplay('6')" data-key="6">6</button>
                <button class="btn operator" onclick="appendToDisplay('*')" data-key="*">×</button>
                
                <!-- Row 4 -->
                <button class="btn variable" onclick="appendToDisplay('i')">i</button>
                <button class="btn operator" onclick="appendToDisplay('%')">%</button>
                <button class="btn operator" onclick="appendToDisplay('>=')">≥</button>
                <button class="btn number" onclick="appendToDisplay('1')" data-key="1">1</button>
                <button class="btn number" onclick="appendToDisplay('2')" data-key="2">2</button>
                <button class="btn number" onclick="appendToDisplay('3')" data-key="3">3</button>
                <button class="btn operator" onclick="appendToDisplay('-')" data-key="-">-</button>
                
                <!-- Row 5 -->
                <button class="btn variable" onclick="appendToDisplay('x')">x</button>
                <button class="btn variable" onclick="appendToDisplay('y')">y</button>
                <button class="btn operator" onclick="calculateResult()">=</button>
                <button class="btn number zero" onclick="appendToDisplay('0')" data-key="0">0</button>
                <button class="btn number" onclick="appendToDisplay('.')" data-key=".">.</button>
                <button class="btn equals" onclick="calculateResult()" data-key="Enter">▶</button>
                <button class="btn operator" onclick="appendToDisplay('+')" data-key="+">+</button>
            </div>
        </div>

        <!-- Trigonometry Section -->
        <div id="trigonometry" class="tab-content">
            <div class="buttons">
                <!-- Row 1 -->
                <button class="btn function" onclick="insertFunction('sin(')">sin</button>
                <button class="btn function" onclick="insertFunction('cos(')">cos</button>
                <button class="btn function" onclick="insertFunction('tan(')">tan</button>
                <button class="btn operator" onclick="appendToDisplay('(')" data-key="(">(</button>
                <button class="btn operator" onclick="appendToDisplay(')')" data-key=")">)</button>
                <button class="btn clear" onclick="clearDisplay()">AC</button>
                
                <!-- Row 2 -->
                <button class="btn function" onclick="insertFunction('asin(')">sin⁻¹</button>
                <button class="btn function" onclick="insertFunction('acos(')">cos⁻¹</button>
                <button class="btn function" onclick="insertFunction('atan(')">tan⁻¹</button>
                <button class="btn number" onclick="appendToDisplay('7')" data-key="7">7</button>
                <button class="btn number" onclick="appendToDisplay('8')" data-key="8">8</button>
                <button class="btn number" onclick="appendToDisplay('9')" data-key="9">9</button>
                <button class="btn operator" onclick="appendToDisplay('/')" data-key="/">÷</button>
                
                <!-- Row 3 -->
                <button class="btn function" onclick="insertFunction('sinh(')">sinh</button>
                <button class="btn function" onclick="insertFunction('cosh(')">cosh</button>
                <button class="btn function" onclick="insertFunction('tanh(')">tanh</button>
                <button class="btn number" onclick="appendToDisplay('4')" data-key="4">4</button>
                <button class="btn number" onclick="appendToDisplay('5')" data-key="5">5</button>
                <button class="btn number" onclick="appendToDisplay('6')" data-key="6">6</button>
                <button class="btn operator" onclick="appendToDisplay('*')" data-key="*">×</button>
                
                <!-- Row 4 -->
                <button class="btn constant" onclick="appendToDisplay('3.14159')">π</button>
                <button class="btn constant" onclick="appendToDisplay('2.71828')">e</button>
                <button class="btn function" onclick="toggleRadDeg()">RAD</button>
                <button class="btn number" onclick="appendToDisplay('1')" data-key="1">1</button>
                <button class="btn number" onclick="appendToDisplay('2')" data-key="2">2</button>
                <button class="btn number" onclick="appendToDisplay('3')" data-key="3">3</button>
                <button class="btn operator" onclick="appendToDisplay('-')" data-key="-">-</button>
                
                <!-- Row 5 -->
                <button class="btn function" onclick="deleteLast()">⌫</button>
                <button class="btn operator" onclick="calculateResult()">=</button>
                <button class="btn number zero" onclick="appendToDisplay('0')" data-key="0">0</button>
                <button class="btn number" onclick="appendToDisplay('.')" data-key=".">.</button>
                <button class="btn equals" onclick="calculateResult()" data-key="Enter">▶</button>
                <button class="btn operator" onclick="appendToDisplay('+')" data-key="+">+</button>
            </div>
        </div>

        <!-- Calculus Section -->
        <div id="calculus" class="tab-content">
            <div class="buttons">
                <!-- Row 1 -->
                <button class="btn function" onclick="insertFunction('derivative(')">d/dx</button>
                <button class="btn function" onclick="insertFunction('integral(')">∫</button>
                <button class="btn function" onclick="insertFunction('limit(')">lim</button>
                <button class="btn operator" onclick="appendToDisplay('(')" data-key="(">(</button>
                <button class="btn operator" onclick="appendToDisplay(')')" data-key=")">)</button>
                <button class="btn clear" onclick="clearDisplay()">AC</button>
                
                <!-- Row 2 -->
                <button class="btn function" onclick="insertFunction('exp(')">eˣ</button>
                <button class="btn function" onclick="insertFunction('ln(')">ln</button>
                <button class="btn function" onclick="insertFunction('log10(')">log₁₀</button>
                <button class="btn number" onclick="appendToDisplay('7')" data-key="7">7</button>
                <button class="btn number" onclick="appendToDisplay('8')" data-key="8">8</button>
                <button class="btn number" onclick="appendToDisplay('9')" data-key="9">9</button>
                <button class="btn operator" onclick="appendToDisplay('/')" data-key="/">÷</button>
                
                <!-- Row 3 -->
                <button class="btn function" onclick="insertFunction('abs(')">|x|</button>
                <button class="btn function" onclick="insertFunction('floor(')">⌊x⌋</button>
                <button class="btn function" onclick="insertFunction('ceil(')">⌈x⌉</button>
                <button class="btn number" onclick="appendToDisplay('4')" data-key="4">4</button>
                <button class="btn number" onclick="appendToDisplay('5')" data-key="5">5</button>
                <button class="btn number" onclick="appendToDisplay('6')" data-key="6">6</button>
                <button class="btn operator" onclick="appendToDisplay('*')" data-key="*">×</button>
                
                <!-- Row 4 -->
                <button class="btn constant" onclick="appendToDisplay('3.14159')">π</button>
                <button class="btn constant" onclick="appendToDisplay('2.71828')">e</button>
                <button class="btn function" onclick="insertFunction('sum(')">Σ</button>
                <button class="btn number" onclick="appendToDisplay('1')" data-key="1">1</button>
                <button class="btn number" onclick="appendToDisplay('2')" data-key="2">2</button>
                <button class="btn number" onclick="appendToDisplay('3')" data-key="3">3</button>
                <button class="btn operator" onclick="appendToDisplay('-')" data-key="-">-</button>
                
                <!-- Row 5 -->
                <button class="btn function" onclick="deleteLast()">⌫</button>
                <button class="btn operator" onclick="calculateResult()">=</button>
                <button class="btn number zero" onclick="appendToDisplay('0')" data-key="0">0</button>
                <button class="btn number" onclick="appendToDisplay('.')" data-key=".">.</button>
                <button class="btn equals" onclick="calculateResult()" data-key="Enter">▶</button>
                <button class="btn operator" onclick="appendToDisplay('+')" data-key="+">+</button>
            </div>
        </div>

        <!-- Units Conversion Section -->
        <div id="units" class="tab-content">
            <div class="conversion-container">
                <div class="conversion-category">
                    <h3>Category</h3>
                    <select id="categorySelect" onchange="updateUnits()">
                        <option value="length">Length</option>
                        <option value="weight">Weight</option>
                        <option value="temperature">Temperature</option>
                        <option value="area">Area</option>
                        <option value="volume">Volume</option>
                        <option value="time">Time</option>
                        <option value="speed">Speed</option>
                        <option value="energy">Energy</option>
                        <option value="power">Power</option>
                        <option value="pressure">Pressure</option>
                        <option value="data">Data Storage</option>
                        <option value="currency">Currency</option>
                    </select>
                </div>
                
                <div class="conversion-input">
                    <div class="input-group">
                        <label>From:</label>
                        <input type="number" id="fromValue" placeholder="Enter value" oninput="convertUnits()">
                        <select id="fromUnit" onchange="convertUnits()"></select>
                    </div>
                    
                    <div class="input-group">
                        <label>To:</label>
                        <input type="number" id="toValue" placeholder="Result" readonly>
                        <select id="toUnit" onchange="convertUnits()"></select>
                    </div>
                </div>
                
                <div class="quick-conversions">
                    <h4>Quick Reference</h4>
                    <div id="quickConversions"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
